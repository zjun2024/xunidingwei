name: Xunidingwei
options:
  bundleIdPrefix: com.zjun2024
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Xunidingwei:
    type: application
    platform: iOS
    sources:
      - path: Xunidingwei
        excludes:
          - "Info.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zjun2024.xunidingwei
        PRODUCT_NAME: Xunidingwei
        INFOPLIST_FILE: Xunidingwei/Info.plist
        CODE_SIGN_ENTITLEMENTS: Xunidingwei/Xunidingwei.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Xunidingwei/Bridging/Xunidingwei-Bridging-Header.h
        # 私有头文件只有声明没有实现，符号在运行时由 CoreLocation 提供
        CLANG_ENABLE_MODULES: YES
        # 桥接头 #import 的私有头文件在 Private/ 下
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Xunidingwei/Private"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - sdk: Security.framework
      - sdk: CoreLocation.framework
      - sdk: MapKit.framework
      - sdk: AVFoundation.framework

schemes:
  Xunidingwei:
    build:
      targets:
        Xunidingwei: all
    run:
      config: Release
    archive:
      config: Release
